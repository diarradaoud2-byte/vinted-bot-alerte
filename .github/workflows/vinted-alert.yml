name: Vinted Alert Bot

on:
  schedule:
    # Toutes les 10 minutes — laisse le temps à chaque run de scanner plus
    # d'annonces par recherche sans se faire bloquer par Vinted.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # permet de lancer le bot manuellement depuis l'onglet Actions

# Empêche deux runs de tourner en même temps (évite les conflits Git si un
# run précédent n'est pas encore terminé quand le suivant démarre).
concurrency:
  group: vinted-bot
  cancel-in-progress: false

permissions:
  contents: write  # nécessaire pour committer seen_items.json

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alerte_vinted.py

      - name: Sauvegarder la mémoire des annonces vues
        run: |
          git config --global user.name "vinted-bot"
          git config --global user.email "vinted-bot@users.noreply.github.com"
          git add seen_items.json
          git diff --quiet --cached || git commit -m "Update seen items [skip ci]"
          git pull --rebase origin main
          git push
