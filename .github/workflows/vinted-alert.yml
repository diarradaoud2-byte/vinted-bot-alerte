name: Vinted Alert Bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alerte_vinted.py

      - name: Sauvegarder la mémoire des annonces vues
        run: |
          git config --global user.name "vinted-bot"
          git config --global user.email "vinted-bot@users.noreply.github.com"
          git add seen_items.json
          git diff --quiet --cached || git commit -m "Update seen items [skip ci]"
          git push
